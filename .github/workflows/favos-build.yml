name: FavOS build (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "FavOS/**"
      - "FavOSApp/**"
      - "project.yml"
      - ".github/workflows/favos-build.yml"

permissions:
  contents: write  # serve al passo che pubblica gli errori di build

jobs:
  build:
    name: Build FavOSApp (iOS IPA)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project CreaSito.xcodeproj \
            -scheme FavOSApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build/build-output.log | tail -n 80

      - name: Publish build errors in repo (readable without auth)
        if: failure()
        run: |
          {
            echo "### Errore build CI FavOS — run ${{ github.run_id }}, sha ${{ github.sha }}"
            echo
            echo '```'
            grep -E "error:|fatal error:" build/build-output.log | head -80 || echo "Nessuna riga 'error:' trovata nel log"
            echo '```'
          } > favos-build-errors.log || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add favos-build-errors.log
          git commit -m "CI: errori di build FavOS (${{ github.sha }})" || echo "nessun log da committare"
          git push || echo "push log non riuscito"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          cp -R "build/Build/Products/Release-iphoneos/FavOSApp.app" "out/Payload/"
          cd out
          ditto -c -k --keepParent Payload "FavOS-unsigned.ipa"
          echo "IPA: $(stat -f%z FavOS-unsigned.ipa) bytes"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: favos-build-log
          path: |
            build/Logs
            build/build-output.log
            **/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FavOS-unsigned-ipa
          path: out/FavOS-unsigned.ipa
          retention-days: 14
