name: Spedizioni
options:
  bundleIdPrefix: com.spedizioni
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Spedizioni:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: "Spedizioni"
        PRODUCT_BUNDLE_IDENTIFIER: com.spedizioni.tracker
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Spedizioni:
    build:
      targets:
        Spedizioni: all
