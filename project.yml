name: CreaSito
options:
  bundleIdPrefix: com.spedizioni
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  # package Swift locale: il wrapper di FavOS (VM Favilla + kernel + UI)
  FavOS:
    path: FavOS

targets:
  CreaSito:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: "CreaSito"
        PRODUCT_BUNDLE_IDENTIFIER: com.spedizioni.creasito
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # App che fa girare FavOS: shell SwiftUI minima sul package FavOS.
  # Il nome del target NON deve essere "FavOS" (il modulo del package
  # si chiamerebbe FavOS e `import FavOS` diventerebbe ambiguo).
  FavOSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FavOSApp
    dependencies:
      - package: FavOS
    settings:
      base:
        PRODUCT_NAME: "FavOSApp"
        PRODUCT_BUNDLE_IDENTIFIER: com.spedizioni.favos
        INFOPLIST_FILE: FavOSApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  CreaSito:
    build:
      targets:
        CreaSito: all
  FavOSApp:
    build:
      targets:
        FavOSApp: all
